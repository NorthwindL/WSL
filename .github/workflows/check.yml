name: Installer checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qtbase5-dev
      - name: Check installer and staging
        run: |
          bash -n install.sh
          python3 -m unittest discover -s tests -v
      - name: Compile embedded Qt clipboard bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('install.sh').read_text().split("<<'SESSION_CPP'\n", 1)[1].split('\nSESSION_CPP\n', 1)[0]
          Path('/tmp/session.cpp').write_text(source)
          PY
          g++ -std=c++17 -Wall -Wextra -O2 -fPIC /tmp/session.cpp -o /tmp/session $(pkg-config --cflags --libs Qt5Gui)
