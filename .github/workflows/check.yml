name: Installer checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qtbase5-dev libx11-dev xvfb xauth xclip
      - name: Check installer and staging
        run: |
          bash -n install.sh
          python3 -m unittest discover -s tests -v
      - name: Compile QtCore/X11 clipboard bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('install.sh').read_text().split("<<'SESSION_CPP'\n", 1)[1].split('\nSESSION_CPP\n', 1)[0]
          Path('/tmp/session.cpp').write_text(source)
          PY
          g++ -std=c++17 -Wall -Wextra -O2 -fPIC /tmp/session.cpp -o /tmp/session $(pkg-config --cflags --libs Qt5Core x11)
      - name: Compile mixed-format clipboard application fixture
        run: g++ -std=c++17 -O2 -fPIC tests/mixed_clipboard.cpp -o /tmp/mixed-clipboard $(pkg-config --cflags --libs Qt5Gui)
      - name: Verify lazy X11 text, file and image clipboard requests
        run: QT_BRIDGE_BINARY=/tmp/session MIXED_CLIPBOARD_BINARY=/tmp/mixed-clipboard xvfb-run -a python3 -m unittest discover -s tests -p test_clipboard_integration.py -v
  windows-protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows clipboard protocol guards without clipboard access
        shell: powershell
        run: ./tests/test_windows_protocol.ps1
